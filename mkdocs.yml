site_name: Brain Lab | IITGN
dev_addr: 127.0.0.1:8000
site_url: https://brain-informatics.github.io/
site_description: Welcome to Brain and Informatics Lab (Brain Lab) at IIT Gandhinagar, where diverse and motivated students collaborate on groundbreaking research in computational neuroscience.
site_author: Brain Lab, IIT Gandhinagar

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  palette: 
    scheme: default
    primary: white
    accent: blue
  font:
    text: Space Grotesk
    code: Fira Code
  features:
    - navigation.top
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.select
  custom_dir: docs/overrides

nav:
  - index.md
  - Publications:
    - publications/index.md
  - team.md
  - contact.md
  - Join Us: '/#get-involved'

markdown_extensions: 
  - tables
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - glightbox
  - search
  - tags
  - blog:
      blog_dir: publications
      post_date_format: yyyy
      blog_toc: false
      post_readtime: false
      pagination: true
      archive: false
  - blog:
      blog_dir: news
      post_date_format: yyyy
      blog_toc: false
      post_readtime: false
      pagination: true
      archive: false

extra_css:
  - stylesheets/extra.css
  - stylesheets/carousel.css
  - stylesheets/team.css
  - stylesheets/recent_publications.css

extra_javascript:
  - javascripts/carousel.js

extra:
  # If true, the homepage "Recent Publications" section (recent_post_hook.py)
  # only shows the latest non-Preprint publications.
  filter_preprint: true
  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/company/brain-and-informatics-lab/

hooks:
  - recent_post_hook.py
